<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин пончиков</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffe4e1 0%, #fafad2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;     
        }
        h1 {
            color: red;
            font-size: 2.7em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 #fff6f6, 4px 4px 8px #ffaaaacea;
            letter-spacing: 3px;
        }
        img {
            width: 320px;
            max-width: 80vw;
            border: 6px solid #ffb347;
            border-radius: 50%;
            box-shadow: 0 8px 32px #f6728077;
            background: #ffffffcc;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        img:hover {
            box-shadow: 0 12px 48px #eb638377;
            border-color: #ff6f61;
        }
    </style>
</head>
<body>
    <h1>Мир пончиков</h1>
    <img src="/uploads/2023/02/donut.png" alt="Пончик">
</body>
</html>
