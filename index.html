<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Магазин пончиков</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4e1 0%, #fafad2 100%);
            margin: 0;
            height: 100vh;
            position: relative;
        }
        h1 {
            font-size: 2.7em;
            color: red; /* ЯРКО-КРАСНЫЙ ЗАГОЛОВОК */
            text-shadow: 2px 2px 0 #fff6f6, 4px 4px 8px #ffaaaacea;
            position: absolute;
            top: 40px;
            left: 45px;
            letter-spacing: 3px;
        }
        img {
            width: 320px;
            height: auto;
            position: absolute;
            top: 120px;
            right: 50px;
            border: 6px solid #ffb347;
            border-radius: 50%;
            box-shadow: 0 8px 32px #f6728077;
            background: #ffffffcc;
            transition: box-shadow 0.3s;
        }
        img:hover {
            box-shadow: 0 12px 48px #eb638377;
            border-color: #ff6f61;
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
            z-index: 0;
        }
        .circle1 {
            width: 200px; height: 200px; background: #ffecb3;
            left: 20px; top: 70px;
        }
        .circle2 {
            width: 150px; height: 150px; background: #ffc1e3;
            right: 10px; top: 320px;
        }
        .circle3 {
            width: 100px; height: 100px; background: #b3ffd9;
            left: 100px; bottom: 60px;
        }
    </style>
</head>
<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
    <h1>Мир пончиков</h1>
    <img src="/uploads/2023/02/donut.png" alt="Пончик">
</body>
</html>
